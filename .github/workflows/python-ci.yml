name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-build-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m pip install .

      - name: Run complete test suite
        run: python -m pytest -v

      - name: Validate agent workflow contracts
        run: python scripts/validate_agent_workflow.py

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Test wheel installation and console command
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps dist/*.whl
          test "$("$RUNNER_TEMP/wheel-env/bin/calculator-cli" add 2 3)" = "5"
          test "$("$RUNNER_TEMP/wheel-env/bin/python" -m calculator divide 12 3)" = "4.0"
