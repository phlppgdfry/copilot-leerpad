[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-cli"
version = "1.0.0"
description = "A simple calculator with a command-line interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
calculator-cli = "calculator_cli:main"

[tool.setuptools]
py-modules = ["calculator", "calculator_cli"]
